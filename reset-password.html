<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowe hasło • RANDO</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top right,#382348,#110c1b 70%);font-family:Inter,Arial,sans-serif;color:#fff;padding:20px}.card{width:min(100%,440px);padding:34px;background:#23182f;border:1px solid #60477a;border-radius:22px;box-shadow:0 24px 90px #0007}.brand{display:flex;align-items:center;gap:12px;font-size:29px;font-weight:800;letter-spacing:-1px}.mark{display:grid;place-items:center;background:linear-gradient(140deg,#ae78ff,#6b37e5);width:48px;height:48px;border-radius:14px;font-size:26px}h1{font-size:27px;margin:26px 0 12px}p{color:#c8b9d4;line-height:1.5}label{display:block;margin:20px 0 8px;color:#e2d6ec}input{width:100%;padding:15px;border:1px solid #725b87;border-radius:12px;background:#160f20;color:white;font-size:16px}input:focus{outline:2px solid #a475ff}button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:12px;background:linear-gradient(110deg,#a76aff,#713deb);color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin-top:18px;color:#e9d8ff}.back{display:inline-block;margin-top:16px;color:#d3b7ff;text-decoration:none}.foot{text-align:center;margin-top:28px;font-size:11px;letter-spacing:2px;color:#a995bd}
</style></head><body><main class="card"><div class="brand"><span class="mark">R.</span><span>rando<span style="color:#a477ff">.</span></span></div><h1>Ustaw nowe hasło</h1><p>Wprowadź nowe hasło, aby odzyskać dostęp do konta RANDO.</p><form id="form" hidden><label for="password">Nowe hasło</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Powtórz nowe hasło</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="save" type="submit">Zapisz nowe hasło</button></form><p id="status" class="status" role="status">Sprawdzamy link resetujący...</p><a class="back" href="./">← Wróć do RANDO</a><div class="foot">ONE DAY. ONE STRANGER. ONE MOMENT.</div></main>
<script src="./config.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id), cfg=window.RANDO_CONFIG||{};
const status=$('status');
if(!/^https:\/\/.+\.supabase\.co$/.test(cfg.url||'')||!cfg.publishableKey){status.textContent='Brak konfiguracji Supabase w config.js.';}
else{
 const db=createClient(cfg.url,cfg.publishableKey);
 let ready=false;
 const show=()=>{ready=true;$('form').hidden=false;status.textContent='Link zweryfikowany. Możesz ustawić nowe hasło.';};
 db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)show();});
 (async()=>{
   try{
     const params=new URLSearchParams(location.search);
     const tokenHash=params.get('token_hash');
     if(tokenHash&&params.get('type')==='recovery'){
       const {error}=await db.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
       if(error)throw error;
       show();
     }else{
       const {data,error}=await db.auth.getSession();
       if(error)throw error;
       if(data.session&&((location.hash||'').includes('type=recovery')||params.has('code')))show();
       else if(!ready)status.textContent='Link jest nieprawidłowy lub wygasł. Poproś o nowy link z ekranu logowania RANDO.';
     }
   }catch(e){status.textContent='Nie udało się zweryfikować linku: '+e.message;}
 })();
 $('form').onsubmit=async e=>{
   e.preventDefault();if(!ready)return;
   if($('password').value!==$('confirm').value){status.textContent='Hasła nie są takie same.';return}
   if($('password').value.length<8){status.textContent='Hasło musi mieć co najmniej 8 znaków.';return}
   $('save').disabled=true;status.textContent='Zapisywanie...';
   const {error}=await db.auth.updateUser({password:$('password').value});
   $('save').disabled=false;
   if(error){status.textContent='Błąd: '+error.message;return}
   $('form').hidden=true;status.textContent='✓ Hasło zmienione! Możesz wrócić do RANDO i się zalogować.';
   await db.auth.signOut();
 };
}
</script></body></html>
